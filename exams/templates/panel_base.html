{% load static %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل استاد · آزمون‌های دکتر باقری</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;800&family=STIX+Two+Text:ital@1&display=swap">
<link rel="stylesheet" href="{% static 'css/math.css' %}">
<link rel="stylesheet" href="{% static 'css/panel.css' %}">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
{% block head %}{% endblock %}
</head>
<body class="panel">
<aside class="side">
  <a class="brand" href="{% url 'teacher_home' %}"><i>π</i>پنل استاد</a>
  <nav>
    <a href="{% url 'teacher_home' %}" class="{% if sec == 'dash' %}on{% endif %}">داشبورد و نتایج</a>
    <a href="{% url 'teacher_exams' %}" class="{% if sec == 'exams' %}on{% endif %}">ساخت و ویرایش آزمون</a>
    <a href="{% url 'teacher_bank' %}" class="{% if sec == 'banks' %}on{% endif %}">بانک سؤال</a>
    <a href="{% url 'teacher_groups' %}" class="{% if sec == 'groups' %}on{% endif %}">گروه‌ها (کلاس‌ها)</a>
    <a href="{% url 'teacher_students' %}" class="{% if sec == 'students' %}on{% endif %}">دانش‌آموزان</a>
    <a href="{% url 'home' %}">سایت آزمون</a>
  </nav>
  <div class="foot"><button class="ghost" id="theme" type="button" aria-label="تغییر تم"></button>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="ghost">خروج</button></form></div>
</aside>
<main class="pmain">
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="{% static 'js/theme.js' %}"></script>
<script src="{% static 'js/panel.js' %}"></script>
</body>
</html>
