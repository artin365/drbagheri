<div class="field{% if field.field.widget.input_type == 'checkbox' %} chk{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}<label>{{ field }} {{ field.label }}</label>
  {% else %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% endif %}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
  {% for e in field.errors %}<em>{{ e }}</em>{% endfor %}
</div>
